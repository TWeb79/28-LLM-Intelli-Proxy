services:
  llmproxy:
    build:
      context: .
      dockerfile: Dockerfile

    image: llmproxy:latest   # local image only
    container_name: llmproxy
    restart: unless-stopped

    ports:
      - "8128:8128"
      - "8028:8028"

    volumes:
      - proxy_data:/data
      - ./config.yaml:/app/config.yaml:ro

    environment:
      PROXY_PORT: 8128
      DASHBOARD_PORT: 8028
      LOG_LEVEL: info
      OLLAMA_HOST: host.docker.internal   # connect to host Ollama
      OLLAMA_PORT: 11434
      NVIDIA_API_KEY: ""
      DECISION_MODEL: ""
      FALLBACK_MODEL: qwen2.5:8b
      DATA_DIR: /data
      PROXY_HOST: 0.0.0.0
      WEB_HOST: 0.0.0.0
      CLASSIFIER_MODEL: qwen2.5:8b
      REQUEST_TIMEOUT: 120
      FALLBACK_TIMEOUT: 30

    networks:
      - llmproxy_net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8128/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  proxy_data:

networks:
  llmproxy_net:
    driver: bridge