services:
  llmproxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: llmproxy:latest
    container_name: llmproxy
    restart: unless-stopped

    ports:
      - "${PROXY_PORT:-8128}:8128"
      - "${DASHBOARD_PORT:-8028}:8028"

    volumes:
      - proxy_data:/data
      - ./config.yaml:/app/config.yaml:ro

    environment:
      PROXY_PORT: ${PROXY_PORT:-8128}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8028}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OLLAMA_HOST: ${OLLAMA_HOST:-127.0.0.1}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      DECISION_MODEL: ${DECISION_MODEL:-}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-qwen2.5:8b}
      DATA_DIR: /data
      PROXY_HOST: 0.0.0.0
      WEB_HOST: 0.0.0.0
      CLASSIFIER_MODEL: qwen2.5:8b
      REQUEST_TIMEOUT: 120
      FALLBACK_TIMEOUT: 30

    networks:
      - llmproxy_net

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8128/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  proxy_data:
    driver: local

networks:
  llmproxy_net:
    driver: bridge